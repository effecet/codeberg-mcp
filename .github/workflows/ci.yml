name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC: keeps the badge honest against dependency drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-dependency-glob: "**/requirements*.txt"

      - name: Install dependencies
        run: |
          uv venv
          # ruff is pinned: an unpinned install turned CI red when a new release
          # widened the default rules. Bump deliberately (Dependabot cannot see this line).
          uv pip install 'ruff==0.16.2' -r requirements.txt

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
