# Dependabot version updates. Security alerts are configured separately
# (repo Settings -> Code security); this file schedules version bumps.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[deps]"
    ignore:
      # A major mcp bump has broken the server before (2.x renamed FastMCP and
      # changed how tool errors reach the client); requirements.txt pins <3 on
      # purpose. Migrate deliberately.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[ci]"
    groups:
      github-actions:
        patterns:
          - "*"
